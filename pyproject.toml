[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "myipcams"
version = "0.1.0"
description = "Visualizador moderno de Câmeras IP (ONVIF/RTSP/iCSee) com Auto-Discovery e Rastreamento Dinâmico de IPs"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Adenauer Sampaio", email = "pr.adenauer@gmail.com" }
]
keywords = ["cctv", "camera", "ip-camera", "onvif", "rtsp", "icsee", "xiongmai", "ptz", "streaming"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Display",
    "Topic :: Security",
]
dependencies = [
    "PyQt6>=6.5.0",
    "opencv-python-headless>=4.8.0",
    "requests>=2.30.0",
]

[project.urls]
Homepage = "https://github.com/adenauersampaio/myipcams"
Repository = "https://github.com/adenauersampaio/myipcams.git"
Issues = "https://github.com/adenauersampaio/myipcams/issues"

[project.scripts]
myipcams = "myipcams.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["myipcams*"]

[tool.setuptools.package-data]
myipcams = ["assets/*"]
